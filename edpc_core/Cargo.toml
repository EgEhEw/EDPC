[package]
name = "edpc_core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib", "cdylib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
zip = { version = "2.2", default-features = false, features = ["deflate"] }
rand = "0.8"
walkdir = "2.5"
